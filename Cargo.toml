[workspace]
resolver = "2"
members = ["crates/grading-core"]
# zk crates build only with the SP1 toolchain (Linux/WSL2); keeping them out of
# the root workspace keeps `cargo test` green on any machine.
exclude = ["zk/program", "zk/script"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kadircanyildirm-crypto/quaestor"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
