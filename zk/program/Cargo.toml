[package]
name = "quaestor-program"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned exactly, not as a courtesy to reproducible builds but because the
# guest ELF's image ID *is* part of the claim: it is what tells a verifier
# which program produced a proof. A floating dependency would silently change
# the image ID, and with it the identity of the code being attested.
sp1-zkvm = "=6.3.1"
grading-core = { path = "../../crates/grading-core", default-features = false }

[workspace]
