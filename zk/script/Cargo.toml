[package]
name = "ispat-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pin exactly on first Linux build; "6" tracks the SP1 major current mid-2026.
sp1-sdk = "6"
grading-core = { path = "../../crates/grading-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[build-dependencies]
sp1-build = "6"

[workspace]
