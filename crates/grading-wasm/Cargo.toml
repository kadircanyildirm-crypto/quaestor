[package]
name = "grading-wasm"
description = "WebAssembly bindings for grading-core: the browser explainer and the candidate-side benchmark"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
grading-core = { path = "../grading-core" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Built for wasm32-unknown-unknown only, so it stays out of the root workspace
# (and out of `cargo test` on the host), like the zk crates.
[workspace]
